name: Docker images

# Builds the `gateway-cre` and `runner` targets of the root Dockerfile for
# linux/arm64 and pushes them to GHCR as ghcr.io/litmus-protocol/gateway-cre
# and ghcr.io/litmus-protocol/runner, tagged :latest and :<commit sha>. The
# lean `gateway` target is not published: gateway-cre adds the cre CLI, bun
# and the auditor workflow, so the gateway runs the Chainlink CRE audit itself.
#
# On push, each image is rebuilt only when something it is built from changed
# (see the filters in the `changes` job), so a web-only commit builds nothing.
# A manual run builds both.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/litmus-protocol

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Inputs shared by both images: the Dockerfile, the install layer and the shared package.
            common: &common
              - "Dockerfile"
              - ".dockerignore"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig.base.json"
              - "packages/shared/**"
              - ".github/workflows/docker.yml"
            gateway:
              - *common
              - "apps/gateway/**"
              # The gateway bundles the breaker bot (workspace dependency).
              - "apps/breaker-bot/**"
              # gateway-cre ships the CRE auditor workflow.
              - "workflows/auditor/**"
            runner:
              - *common
              - "apps/runner/**"

      - id: pick
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          GATEWAY: ${{ steps.filter.outputs.gateway }}
          RUNNER: ${{ steps.filter.outputs.runner }}
        run: |
          targets=()
          if [ "$MANUAL" = true ] || [ "$GATEWAY" = true ]; then targets+=('"gateway-cre"'); fi
          if [ "$MANUAL" = true ] || [ "$RUNNER" = true ]; then targets+=('"runner"'); fi
          echo "targets=[$(IFS=,; echo "${targets[*]}")]" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.targets != '[]'
    name: ${{ matrix.target }}
    # Native arm64 runner: no QEMU, so pnpm install and the SEA build run at full speed.
    runs-on: ubuntu-24.04-arm
    # Per image, so a newer commit only supersedes an in-flight build of the same image.
    concurrency:
      group: docker-${{ matrix.target }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.target }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.target }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-arm64
