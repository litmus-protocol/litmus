name: Docker images

# Builds the gateway and runner targets of the root Dockerfile for linux/arm64
# and pushes them to GHCR as :latest and :<commit sha>.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/litmus-protocol

jobs:
  build:
    name: ${{ matrix.target }}
    # Native arm64 runner: no QEMU, so pnpm install and the SEA build run at full speed.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        target: [gateway, runner]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.target }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.target }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-arm64
